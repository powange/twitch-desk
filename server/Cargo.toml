[package]
name = "twitch-desk-sync"
version = "0.6.0"
description = "Serveur de synchronisation de Twitch Desk : cadeaux, groupes, giveaways, chaînes et fiches de streamers mis en commun, web app mobile"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6.7", features = ["timeout", "fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
