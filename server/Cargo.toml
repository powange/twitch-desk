[package]
name = "twitch-desk-sync"
version = "0.1.0"
description = "Serveur de synchronisation de Twitch Desk : cadeaux, groupes, giveaways, chaînes et fiches de streamers mis en commun"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
