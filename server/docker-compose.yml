# Pile Portainer : Stacks → Add stack → Repository
#   Repository URL : https://github.com/powange/twitch-desk
#   Compose path   : server/docker-compose.yml
#   Environment variables : SYNC_CODE (obligatoire), et au besoin les autres ci-dessous
services:
  twitch-desk-sync:
    image: ghcr.io/powange/twitch-desk-sync:latest
    # Ou construire l'image depuis le dépôt au lieu de la télécharger (contexte : la racine du
    # dépôt, pour la web app du dossier web/) :
    # build:
    #   context: ..
    #   dockerfile: server/Dockerfile
    container_name: twitch-desk-sync
    restart: unless-stopped
    environment:
      # Code à communiquer aux utilisateurs (8 caractères au moins)
      SYNC_CODE: ${SYNC_CODE:?Définis SYNC_CODE dans les variables d'environnement de la pile}
      # Données mises en commun : groups, gifts, giveaways, channels, streamers, detection
      SYNC_COLLECTIONS: ${SYNC_COLLECTIONS:-groups,gifts,giveaways,channels,streamers,detection}
      # Durée de conservation de l'historique des modifications, en jours
      SYNC_HISTORY_DAYS: ${SYNC_HISTORY_DAYS:-90}
      # Proxys devant le serveur (adresse du client lue dans X-Forwarded-For, pour bloquer
      # les essais de code répétés) ; 0 si le serveur est joint directement
      SYNC_PROXY_HOPS: ${SYNC_PROXY_HOPS:-1}
      # Web app mobile servie sous /app sur le port de l'API ; un numéro de port ici la sert
      # aussi (et seulement elle) sur ce port : le proxy joint alors twitch-desk-sync:<port>
      SYNC_WEB_PORT: ${SYNC_WEB_PORT:-}
      SYNC_WEB_URL: ${SYNC_WEB_URL:-}
      # Contact donné aux services de push (notifications des téléphones) : mailto:… ou https://…
      SYNC_PUSH_CONTACT: ${SYNC_PUSH_CONTACT:-https://github.com/powange/twitch-desk}
    volumes:
      - twitch-desk-sync:/data
    # Port publié sur l'hôte en HTTP simple : limité à l'hôte lui-même par défaut (le proxy
    # HTTPS joint le serveur par le réseau proxy-network). SYNC_HOST_BIND=0.0.0.0 l'ouvre à
    # toutes les interfaces (déconseillé : le code circulerait en clair)
    ports:
      - "${SYNC_HOST_BIND:-127.0.0.1}:${SYNC_HOST_PORT:-8787}:8787"

volumes:
  twitch-desk-sync:

# Réseau du proxy HTTPS : le proxy joint le serveur par twitch-desk-sync:8787
networks:
  default:
    external: true
    name: proxy-network
