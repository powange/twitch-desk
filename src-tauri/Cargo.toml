[package]
name = "twitch-desk"
version = "0.31.0"
description = "Giveaways, points de chaîne et drops Twitch, sur plusieurs comptes"
authors = ["powange"]
license = "MIT"
repository = "https://github.com/powange/twitch-desk"
edition = "2021"
rust-version = "1.90"

[lib]
name = "twitch_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = "4"
regex = "1"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
url = "2"
uuid = { version = "1", features = ["v4"] }

# Windows : réglage du navigateur intégré (protection contre le pistage)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
