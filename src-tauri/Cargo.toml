[package]
name = "twitch-desk"
version = "0.48.45"
description = "Giveaways, points de chaîne et drops Twitch, sur plusieurs comptes"
authors = ["powange"]
license = "MIT"
repository = "https://github.com/powange/twitch-desk"
edition = "2021"
rust-version = "1.90"

[lib]
name = "twitch_desk_lib"
# Bibliothèque Rust seule : les formats staticlib et cdylib ne servent qu'aux versions
# mobiles (absentes), et chacun refaisait toute l'optimisation à la compilation
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
keyring = "4"
regex = "1"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
url = "2"
# Accents retirés comme l’interface (décomposition Unicode)
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

# Windows : réglage du navigateur intégré (protection contre le pistage)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# Fichier de secrets de secours chiffré pour la session Windows (DPAPI)
# et notifications ouvertes sur une page de l'application (activation par protocole)
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Data_Xml_Dom", "UI_Notifications"] }
windows-registry = "0.6"

[profile.release]
# Optimisation « thin » sur plusieurs unités : compilation de la release nettement plus courte
# (les 4 cœurs des machines de GitHub servent), installateur à peine plus gros
lto = "thin"
codegen-units = 8
opt-level = "s"
strip = true
