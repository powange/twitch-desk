name: CI

# web/ : web app mobile, vérifiée par server.yml (pas par cette CI)
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'server/**', 'web/**', '**.md']
  pull_request:
    paths-ignore: ['site/**', 'server/**', 'web/**', '**.md']

permissions:
  contents: read

# Demande de fusion poussée de nouveau : la vérification précédente est annulée (sur main,
# chaque commit garde la sienne)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Sans cache npm : sa clé (package-lock.json, qui contient la version de l'application)
          # change à chaque version, il n'était jamais relu
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Version figée (même partout : caches de ci.yml, cache.yml et release.yml communs) ; à
          # changer ici et dans les deux autres fichiers en même temps
          toolchain: 1.99.1
          components: clippy
      # Clé propre (distincte de server.yml et de cache.yml) ; relue aussi par les tests de
      # release.yml sous Linux
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: ci
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
