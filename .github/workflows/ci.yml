name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'server/**', '**.md']
  pull_request:
    paths-ignore: ['site/**', 'server/**', '**.md']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          # Sans cache npm : sa clé (package-lock.json, qui contient la version de l'application)
          # change à chaque version, il n'était jamais relu
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Version figée (même partout : caches de ci.yml, cache.yml et release.yml communs) ; à
          # changer ici et dans les deux autres fichiers en même temps
          toolchain: 1.99.1
          components: clippy
      # Clé propre (distincte de server.yml et de cache.yml) ; relue aussi par les tests de
      # release.yml sous Linux
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: ci
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
