# Prépare sur main le cache des dépendances Rust compilées en mode release, pour Windows et
# Linux. Les releases (tags) le relisent : un tag ne peut relire que le cache de main.
# Relancé quand les dépendances changent (pas pour un simple changement de version de
# l'application), chaque semaine (nouvelle version de Rust, cache expiré après 7 jours sans
# usage) ou à la main. Efface ensuite les caches enregistrés sur des tags, jamais relus.
name: Cache de compilation

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/Cargo.toml'
      - '.github/workflows/cache.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-release
  cancel-in-progress: true

jobs:
  changes:
    name: Dépendances modifiées ?
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false
      # Sur un push : Cargo.lock comparé à l'état d'avant le push, sans les lignes de version
      # du paquet twitch-desk lui-même (changées à chaque version) ; Cargo.toml de même, sans
      # sa ligne de version
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != push ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE=HEAD^; fi
          strip_lock() {
            awk '/^\[\[package\]\]/{pkg=""} /^name = /{pkg=$3} !(pkg=="\"twitch-desk\"" && /^version = /)'
          }
          strip_toml() { grep -v '^version = '; }
          lock_before=$(git show "$BEFORE:src-tauri/Cargo.lock" 2>/dev/null | strip_lock | sha256sum)
          lock_after=$(strip_lock < src-tauri/Cargo.lock | sha256sum)
          toml_before=$(git show "$BEFORE:src-tauri/Cargo.toml" 2>/dev/null | strip_toml | sha256sum)
          toml_after=$(strip_toml < src-tauri/Cargo.toml | sha256sum)
          workflow=$(git diff --quiet "$BEFORE" HEAD -- .github/workflows/cache.yml && echo same || echo changed)
          if [ "$lock_before" != "$lock_after" ] || [ "$toml_before" != "$toml_after" ] || [ "$workflow" = changed ]; then
            echo "Dépendances modifiées : cache recompilé"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Seule la version de l'application a changé : cache inchangé"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  warm:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dépendances Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Sans cache npm : sa clé (package-lock.json, qui contient la version de l'application)
          # change à chaque version, il n'était jamais relu

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Version figée (même partout : caches de ci.yml, cache.yml et release.yml communs) ; à
          # changer ici et dans les deux autres fichiers en même temps
          toolchain: 1.99.1

      # Même clé que release.yml
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: release

      - run: npm ci

      # Même compilation que la release (profil et options de tauri build), sans paquets
      - run: npx tauri build --no-bundle

  # Caches enregistrés sur des tags (refs/tags/…) : aucun autre tag ne peut les relire, ils
  # ne font que prendre la place des 10 Go permis
  cleanup:
    name: Ménage des caches
    needs: warm
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --limit 1000 --json id,key,ref --jq '.[] | select(.ref | startswith("refs/tags/")) | "\(.id) \(.ref) \(.key)"' |
            while read -r id ref key; do
              echo "Effacé : $key ($ref)"
              gh cache delete "$id"
            done
