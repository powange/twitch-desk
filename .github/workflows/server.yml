name: Serveur de synchronisation

# Image Docker publiée sur ghcr.io/powange/twitch-desk-sync à chaque modification du serveur
# ou de la web app mobile (web/, construite dans l'image),
# puis redéploiement par le webhook Portainer (secret PORTAINER_WEBHOOK_URL, facultatif).
# Chaque architecture est compilée sur sa propre machine (pas d'émulation), en parallèle des
# vérifications ; l'image n'est étiquetée et déployée que si tout a réussi.
# Demande de fusion (Dependabot…) : mêmes vérifications et mêmes images construites (web app
# comprise), sans rien envoyer ni déployer
on:
  push:
    branches: [main]
    paths: ['server/**', 'web/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'web/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read

# Un seul envoi d'image à la fois : un push plus récent remplace celui en cours
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('server-pr-{0}', github.ref) || 'server-image' }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/twitch-desk-sync

jobs:
  check:
    name: Vérifications
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      # Clé propre : pas de mélange avec le cache de l'application (ci.yml)
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server -> target
          shared-key: server
      - run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path server/Cargo.toml

  build:
    name: Image ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image envoyée sans étiquette (par empreinte) : étiquetée par le job suivant ; demande de
      # fusion : construite seulement
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          # Racine du dépôt : le serveur et la web app (server/Dockerfile.dockerignore)
          context: .
          file: server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Serveur de synchronisation de Twitch Desk
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,scope=server-{0},mode=max', matrix.arch) || '' }}
      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    name: Publication de l'image
    needs: [check, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: server/Cargo.toml
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Une seule image multi-architecture, étiquetée latest, avec la version du serveur, et
      # avec version et commit (une même version recompilée reste distinguable)
      - working-directory: digests
        run: |
          version=$(grep -m1 '^version' ../server/Cargo.toml | cut -d'"' -f2)
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:$version" -t "$IMAGE:$version-${GITHUB_SHA::7}" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$version"

  deploy:
    name: Déploiement
    needs: publish
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      # Webhook de la pile Portainer (secret du dépôt) : redéploiement une fois l'image publiée
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
    steps:
      - name: Webhook Portainer
        if: env.PORTAINER_WEBHOOK_URL != ''
        run: curl -fsS -X POST --max-time 60 "$PORTAINER_WEBHOOK_URL" -o /dev/null && echo "Redéploiement demandé à Portainer"
