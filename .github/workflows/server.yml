name: Serveur de synchronisation

# Image Docker publiée sur ghcr.io/powange/twitch-desk-sync à chaque modification du serveur,
# puis redéploiement par le webhook Portainer (secret PORTAINER_WEBHOOK_URL, facultatif).
# Chaque architecture est compilée sur sa propre machine (pas d'émulation), en parallèle des
# vérifications ; l'image n'est étiquetée et déployée que si tout a réussi
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/twitch-desk-sync

jobs:
  check:
    name: Vérifications
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: server -> target
      - run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path server/Cargo.toml

  build:
    name: Image ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image envoyée sans étiquette (par empreinte) : étiquetée par le job suivant
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Serveur de synchronisation de Twitch Desk
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,scope=server-${{ matrix.arch }},mode=max
      - run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    name: Publication de l'image
    needs: [check, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: server/Cargo.toml
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Une seule image multi-architecture, étiquetée latest et avec la version du serveur
      - working-directory: digests
        run: |
          version=$(grep -m1 '^version' ../server/Cargo.toml | cut -d'"' -f2)
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:$version" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$version"

  deploy:
    name: Déploiement
    needs: publish
    runs-on: ubuntu-24.04
    env:
      # Webhook de la pile Portainer (secret du dépôt) : redéploiement une fois l'image publiée
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
    steps:
      - name: Webhook Portainer
        if: env.PORTAINER_WEBHOOK_URL != ''
        run: curl -fsS -X POST --max-time 60 "$PORTAINER_WEBHOOK_URL" -o /dev/null && echo "Redéploiement demandé à Portainer"
