# Publie une version : pousser un tag vX.Y.Z (même numéro que tauri.conf.json).
# Vérifie le numéro et les tests, compile Windows (installateur NSIS) et Linux (AppImage,
# .deb), signe chaque paquet et publie latest.json, que l'application lit pour se mettre à
# jour. La release reste en brouillon jusqu'à ce que tous les paquets soient envoyés : un
# brouillon n'est pas la « dernière release », les applications gardent donc la version
# précédente (releases/latest/download/latest.json) tant que la nouvelle n'est pas complète.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Numéro de version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag et version de l'application identiques
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag $tag, tauri.conf.json $conf, Cargo.toml $cargo"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version de l'application ($conf / $cargo)"
            exit 1
          fi

  # Tests sous Linux seulement : le code propre à Windows est compilé par le job build, et
  # une compilation qui échoue laisse la release en brouillon (rien n'est publié)
  test:
    name: Tests
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dépendances Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      # Relu sans enregistrer (un cache enregistré sur un tag serait inutilisable) : celui de
      # ci.yml, même compilation
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: ci
          save-if: false

      # Interface : vérification des types (vue-tsc) et compilation
      - name: Interface
        run: |
          npm ci
          npm run build

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  draft:
    name: Release en brouillon
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      # Brouillon créé une fois ici : les deux compilations y envoient leurs paquets
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Twitch Desk $TAG" -f body="Voir les changements dans le dépôt." \
              -F draft=true -F prerelease=false --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dépendances Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # Sans cache npm : un cache enregistré sur un tag ne resservirait jamais
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # Cache des dépendances compilées, préparé sur main par cache.yml (un tag ne peut relire
      # que le cache de main) ; jamais enregistré ici : il resterait attaché au tag, inutilisable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: release
          save-if: false

      - run: npm ci

      # Clé de signature des mises à jour : passée à cette seule étape (pas au job), pour
      # qu'aucune autre étape ni action ne la voie
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: true

  publish:
    name: Publication
    needs: [draft, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Tous les paquets et latest.json sont en place : la release devient la dernière, les
      # applications voient la mise à jour
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.draft.outputs.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq '.assets[].name' | grep -qx latest.json \
            || { echo "::error::latest.json absent de la release"; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true --jq .html_url
