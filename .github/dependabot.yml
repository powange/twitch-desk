# Mises à jour proposées par Dependabot, regroupées pour limiter le nombre de demandes de
# fusion : actions GitHub (épinglées par commit) chaque semaine, le reste chaque mois.
# Les versions majeures des dépendances ne sont pas proposées : elles demandent une migration
# faite à la main (rusqlite, TypeScript…)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    groups:
      app-rust:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: monthly
    groups:
      server-rust:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web-npm:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: monthly
    groups:
      server-images:
        patterns: ['*']
